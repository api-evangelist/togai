                priceType: FLAT
                slabConfig: {}
            rateValues:
            - currency: USD
              slabRates:
              - order: 1
                rate: 15
                slabRateConfig: {}
              rateConfig:
                minimumRate: '1'
                maximumRate: '10'
            displayName: license
            tag: '2'
