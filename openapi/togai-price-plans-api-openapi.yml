          - id: addon.20sidQxYRjs.4oBSU
            rateValues:
            - currency: USD
              rate: 10
            enableProration: false
            displayName: anotherNormal
            tag: '2'
            invoiceTiming: IN_ARREARS
            type: RECURRING
          - id: addon.20sidzySWoa.Bzrcc
