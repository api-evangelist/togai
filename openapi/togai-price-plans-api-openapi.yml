            - currency: USD
              rate: 40
            enableProration: false
            displayName: inadvance
            tag: '1'
            invoiceTiming: IN_ADVANCE
            type: RECURRING
          licenseRateCards:
          - id: addon.20rzlEPp6no.1BYez
            enableProration: false
            ratePlan:
              pricingModel: TIERED
              slabs:
              - order: 1
